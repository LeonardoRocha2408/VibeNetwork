services:
  server:
    build:
      context: .
      dockerfile: SocialNetwork.Server/Dockerfile
    ports:
      - "5199:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: Development
    env_file:
      - SocialNetwork.Server/.env
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      localstack:
        condition: service_started
    
  redis:
    image: redis:alpine
    restart: unless-stopped
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  localstack: 
    image: localstack/localstack:latest
    container_name: localstack
    ports: 
      - "4566:4566"
    environment:
      SERVICES: s3,sqs,sns
      DEBUG: 1
    env_file:
      - SocialNetwork.Server/.env
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    
volumes:
  redis_data: